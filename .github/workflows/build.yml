name: Build

# Builds the original Xbox port on the self-hosted `xbox-sdk` runner, the one
# machine that holds the Xbox SDK, for every push to main and by hand, and
# keeps the game's folder (tools/xbox_package.py --no-maps: default.xbe and
# config.toml) as the run's artifact. The nightly (nightly.yml) and the
# release (release.yml) call this one.
#
# Never on pull_request: a pull request's workflow file is the pull
# request's own, and the runner must not run code from a fork. The runner's
# group (xbox-sdk, in the organization's settings) only takes this file, the
# nightly's and the release's at refs/heads/main, so a branch cannot use it
# either. The SDK never leaves the runner: it is not checked out, cached,
# uploaded, listed or printed here, and the artifact is the package only.
#
# The runner's own .env names where its SDK is (see docs/building.md):
#   OXDK_DIR    OXDK with the SDK in xbox/xdk (lib, include) and cxbe built
#   XBOX_D3D8   the Aug 2001 d3d8ntpr.lib
#   LLVM_DIR    a clang and lld-link to use (empty: the ones on PATH)
on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    inputs:
      game-ref:
        description: A commit of the game to build instead of the submodule's (the nightly's; empty, the submodule's)
        type: string
        default: ""
      ref:
        description: The commit of this repository to build (the release's tag; empty, the run's)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  xbox:
    runs-on: [self-hosted, xbox-sdk]
    timeout-minutes: 60
    steps:
      - name: Check the runner
        run: |
          for name in OXDK_DIR XBOX_D3D8; do
            eval "value=\$$name"
            if [ -z "$value" ] || [ ! -e "$value" ]; then
              echo "::error::$name is not set in the runner's .env, or does not exist"
              exit 1
            fi
          done
          test -x "$OXDK_DIR/xbox/tools/cxbe/cxbe" || { echo "::error::OXDK's cxbe is not built"; exit 1; }
          test -f "$OXDK_DIR/xbox/xdk/lib/xboxkrnl.lib" || { echo "::error::no SDK in OXDK's xbox/xdk"; exit 1; }
          if [ -n "$LLVM_DIR" ] && [ ! -x "$LLVM_DIR/bin/clang" ]; then
            echo "LLVM_DIR ($LLVM_DIR) has no clang: using the ones on PATH"
            echo "LLVM_DIR=" >> "$GITHUB_ENV"
          fi
          python3 --version; ninja --version; clang --version | head -1; lld-link --version

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}
          submodules: true

      # the nightly builds the game's current main without committing it
      - name: Use the requested game commit
        env:
          GAME_REF: ${{ inputs.game-ref }}
        run: |
          if [ -n "$GAME_REF" ]; then
            git -C chupathingyce fetch --depth 1 origin "$GAME_REF"
            git -C chupathingyce checkout --detach FETCH_HEAD
            git -C chupathingyce log -1 --oneline
          fi

      # Linux is case sensitive and the SDK's file names are not consistent:
      # lower-case links beside the originals, in the runner's own SDK folder
      - name: The SDK's file names
        run: python3 tools/xdk_case_links.py port chupathingyce/source chupathingyce/port/console chupathingyce/port/linux/game

      - name: Host tests
        run: CC=clang sh port/xbox/tests/run.sh

      # the build testers get: the debug decomp's asserts compiled out, as the
      # retail game had them, but for the memory checks, and 32 players
      - name: Configure
        run: |
          python3 chupathingyce/configure.py --console-port port/xbox --oxdk "$OXDK_DIR" --xbox-d3d8 "$XBOX_D3D8" \
            --console-no-debug-asserts --console-players 32
          grep -q "default.xbe" build.ninja || { echo "::error::configure did not find the SDK"; exit 1; }

      - name: Build
        run: ninja xbox

      # the game's folder, as a player installs it (without maps); nothing
      # from the SDK is in it: only the XBE and the config
      - name: Package
        run: |
          rm -rf package
          python3 tools/xbox_package.py --no-maps --out package/Warthog
          cp LICENSE package/Warthog/LICENSE
          cp port/xbox/README.md package/Warthog/README.md
          find package -type f -exec ls -l {} +
          for file in $(find package -type f); do
            case "$(basename "$file")" in
              default.xbe|config.toml|LICENSE|README.md) ;;
              *) echo "::error::$file is not a file the package may hold"; exit 1 ;;
            esac
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warthog-xbox-${{ github.sha }}
          path: package
          if-no-files-found: error
          retention-days: 7
