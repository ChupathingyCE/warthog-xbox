name: Port tests

# The console ports' checks that need no console SDK, for every push to main
# and every pull request: the game (the chupathingyce submodule) configures
# with the ports, and the original Xbox port's host tests pass
# (port/xbox/tests/run.sh). The console builds themselves need the user's
# own SDK files, which never come near this repository or its runners.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: port-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# (clang, as on macOS where the port is built: gcc rejects the co-op names
# test's %ls in C89)
jobs:
  host:
    runs-on: ubuntu-latest
    env:
      CC: clang
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Configure, without any console SDK
        run: |
          python3 chupathingyce/configure.py --console-port port/xbox \
            --console-no-debug-asserts --console-players 32
          test -f build.ninja
      - name: Original Xbox host tests
        run: sh port/xbox/tests/run.sh
